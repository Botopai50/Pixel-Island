name: ChatGPT Test Build

on:
  push:
    branches: ["chatgpt/tree-variation-test-20260928"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: Procedural tests
        run: npm test

      - name: Build zero-dependency Windows package
        run: |
          rm -rf artifact standalone-build
          mkdir -p artifact standalone-build
          cp -R dist/. standalone-build/
          cp standalone/INICIAR_JOGO.bat standalone-build/
          cp standalone/SERVIDOR_LOCAL.ps1 standalone-build/
          cp standalone/COMO_INICIAR.txt standalone-build/
          cd standalone-build
          zip -r ../artifact/Pixel-Island-Standalone-Windows.zip .

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: pixel-island-standalone-windows
          path: artifact/Pixel-Island-Standalone-Windows.zip
          if-no-files-found: error
