<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vegetation Botanical Showcase</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #161a20;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #info-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 16px 22px;
        color: #f8fafc;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        pointer-events: none;
        max-width: 480px;
        backdrop-filter: blur(8px);
      }
      #info-panel h1 {
        margin: 0 0 6px 0;
        font-size: 22px;
        color: #38bdf8;
      }
      #info-panel .meta {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 8px;
        line-height: 1.5;
      }
      #info-panel .desc {
        font-size: 14px;
        line-height: 1.5;
        color: #e2e8f0;
      }
      #human-label {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0,0,0,0.7);
        color: #cbd5e1;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="info-panel">
      <h1 id="item-title">Vegetation Showcase</h1>
      <div id="item-meta" class="meta">Iniciando...</div>
      <div id="item-desc" class="desc"></div>
    </div>
    <div id="human-label">🧍 Silhueta de Referência Humana: 1.75m</div>
    <script type="module" src="/src/showcase.ts"></script>
  </body>
</html>
